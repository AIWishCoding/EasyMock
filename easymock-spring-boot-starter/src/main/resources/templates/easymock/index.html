<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyMock - Mock 规则管理</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/easymock/css/easymock.css}">
</head>
<body>
<div class="container-fluid">
    <nav class="navbar navbar-dark bg-dark mb-3 px-3">
        <span class="navbar-brand">EasyMock 管理控制台</span>
        <div>
            <button class="btn btn-outline-light btn-sm me-2" onclick="importRules()">导入规则</button>
            <a class="btn btn-outline-light btn-sm" th:href="@{${@environment.getProperty('easymock.api-path', '/easymock/api')} + '/export'}">导出全部</a>
        </div>
    </nav>

    <div class="row">
        <div class="col-md-3">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <strong>POST 接口列表</strong>
                    <span class="badge bg-secondary" th:text="${#lists.size(endpoints)}">0</span>
                </div>
                <div class="card-body p-0">
                    <div class="p-2">
                        <input type="text" class="form-control form-control-sm"
                               id="endpointSearch" placeholder="搜索接口..."
                               onkeyup="filterEndpoints()">
                    </div>
                    <div class="list-group list-group-flush endpoint-list" id="endpointList">
                        <a th:each="ep : ${endpoints}"
                           th:text="${ep}"
                           th:data-url="${ep}"
                           class="list-group-item list-group-item-action endpoint-item"
                           href="#"
                           onclick="filterRulesByEndpoint(this); return false;">
                        </a>
                        <div th:if="${#lists.isEmpty(endpoints)}"
                             class="list-group-item text-muted text-center">
                            暂未发现 POST 接口
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-9">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <div>
                        <strong>Mock 规则列表</strong>
                        <span class="badge bg-secondary ms-2" id="ruleCount"
                              th:text="${#lists.size(rules)}">0</span>
                        <span class="badge bg-info ms-1 d-none" id="filterBadge"></span>
                        <button class="btn btn-link btn-sm d-none" id="clearFilterBtn"
                                onclick="clearFilter()">清除筛选</button>
                    </div>
                    <a class="btn btn-primary btn-sm"
                       th:href="@{${@environment.getProperty('easymock.page-path', '/easymock')} + '/rule/add'}">
                        + 新建规则
                    </a>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover table-sm mb-0">
                            <thead class="table-light">
                            <tr>
                                <th>规则名称</th>
                                <th>请求路径</th>
                                <th>匹配类型</th>
                                <th>优先级</th>
                                <th>启用</th>
                                <th>操作</th>
                            </tr>
                            </thead>
                            <tbody id="rulesTableBody">
                            <tr th:each="rule : ${rules}" th:data-url="${rule.url}" class="rule-row">
                                <td th:text="${rule.name}"></td>
                                <td><code th:text="${rule.url}"></code></td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${rule.matchType.name() == 'URL'} ? 'bg-primary' : 'bg-warning text-dark'"
                                          th:text="${rule.matchType.name() == 'URL'} ? '接口级别' : '参数级别'"></span>
                                </td>
                                <td th:text="${rule.priority}"></td>
                                <td>
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox"
                                               th:checked="${rule.enabled}"
                                               th:data-id="${rule.id}"
                                               onchange="toggleRule(this)">
                                    </div>
                                </td>
                                <td>
                                    <a class="btn btn-outline-primary btn-sm"
                                       th:href="@{${@environment.getProperty('easymock.page-path', '/easymock')} + '/rule/edit/' + ${rule.id}}">
                                        编辑
                                    </a>
                                    <button class="btn btn-outline-danger btn-sm"
                                            th:data-id="${rule.id}"
                                            onclick="deleteRule(this)">
                                        删除
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(rules)}">
                                <td colspan="6" class="text-center text-muted py-4">
                                    暂无 Mock 规则，点击"+ 新建规则"创建第一条规则
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<input type="hidden" id="importFileInput" style="display:none">
<input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(this)">

<script th:inline="javascript">
    const API_PATH = [[${@environment.getProperty('easymock.api-path', '/easymock/api')}]];
    const PAGE_PATH = [[${@environment.getProperty('easymock.page-path', '/easymock')}]];
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/easymock/js/easymock.js}"></script>
</body>
</html>
